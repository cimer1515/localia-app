name: Build LOCALIA

on:
  push:
    branches:
      - preparacion-final
      - feature/automatic-certificate-issuance
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        run: npm run build
      - name: Syntax-check Netlify functions
        run: |
          node --check netlify/functions/issue-certificate.mjs
          node --check netlify/functions/verify-certificate.mjs
