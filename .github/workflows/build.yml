name: Build CAUSA

on:
  push:
    branches:
      - preparacion-final
      - demo-certificates-test
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build Vite app
        run: npm run build
      - name: Verify demo page is included
        run: test -f dist/demo.html
